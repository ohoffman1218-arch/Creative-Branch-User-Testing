    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <div class="container p-3">
      <h2 class="text-center">Collage</h2>
    </div>

    <div class="container-fluid app-shell p-0">
      <div class="row g-0">
        <div class="col-12">
          <div class="canvas-wrapper">
            <div id="container"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import Konva from 'https://cdn.skypack.dev/konva';

      const container = document.getElementById('container');

      const stage = new Konva.Stage({
        container: 'container',
        width: container.offsetWidth,
        height: container.offsetHeight,
      });

      const layer = new Konva.Layer();
      stage.add(layer);

      const boxWidth = 430;
      const boxHeight = 430;

      const dropZone = new Konva.Rect({
        x: (stage.width() - boxWidth) / 2,
        y: (stage.height() - boxHeight) / 2,
        width: boxWidth,
        height: boxHeight,
        fill: '#dcdcdc',
        stroke: '#000',
        strokeWidth: 14,
        cornerRadius: 6,
      });

      layer.add(dropZone);

      function intersects(r1, r2) {
        return !(
          r2.x > r1.x + r1.width ||
          r2.x + r2.width < r1.x ||
          r2.y > r1.y + r1.height ||
          r2.y + r2.height < r1.y
        );
      }

      function clampToDropZone(node) {
        const minX = dropZone.x();
        const minY = dropZone.y();
        const maxX = dropZone.x() + dropZone.width() - node.width();
        const maxY = dropZone.y() + dropZone.height() - node.height();

        node.x(Math.max(minX, Math.min(node.x(), maxX)));
        node.y(Math.max(minY, Math.min(node.y(), maxY)));
      }

      function addDraggableImage(src, x, y, width, height) {
        const imageObj = new Image();

        imageObj.onload = () => {
          const img = new Konva.Image({
            x,
            y,
            image: imageObj,
            width,
            height,
            draggable: true,
          });

          img.on('mouseover', () => {
            document.body.style.cursor = 'pointer';
          });

          img.on('mouseout', () => {
            document.body.style.cursor = 'default';
          });

          img.on('dragmove', () => {
            const imageRect = {
              x: img.x(),
              y: img.y(),
              width: img.width(),
              height: img.height(),
            };

            const zoneRect = {
              x: dropZone.x(),
              y: dropZone.y(),
              width: dropZone.width(),
              height: dropZone.height(),
            };

            dropZone.stroke(intersects(imageRect, zoneRect) ? '#4f46e5' : '#000');
            layer.batchDraw();
          });

          img.on('dragend', () => {
            const imageRect = {
              x: img.x(),
              y: img.y(),
              width: img.width(),
              height: img.height(),
            };

            const zoneRect = {
              x: dropZone.x(),
              y: dropZone.y(),
              width: dropZone.width(),
              height: dropZone.height(),
            };

            if (intersects(imageRect, zoneRect)) {
              clampToDropZone(img);
            }

            dropZone.stroke('#000');
            layer.batchDraw();
          });

          layer.add(img);
          layer.draw();
        };

        imageObj.src = src;
      }

      addDraggableImage('https://konvajs.org/assets/yoda.jpg', 40, 60, 106, 118);
      addDraggableImage('https://konvajs.org/assets/lion.png', 40, 220, 120, 90);
      addDraggableImage('https://konvajs.org/assets/darth-vader.jpg', 40, 360, 100, 140);

      function resizeStage() {
        const width = container.offsetWidth;
        const height = container.offsetHeight;

        stage.width(width);
        stage.height(height);

        dropZone.position({
          x: (stage.width() - boxWidth) / 2,
          y: (stage.height() - boxHeight) / 2,
        });

        layer.batchDraw();
      }

      window.addEventListener('resize', resizeStage);
    </script>
  </body>
